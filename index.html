<!DOCTYPE html>
<html>
    <head>
        <title>O Terminal</title>
        <link rel="stylesheet" href="style/estilo.css">
        <meta charset="UTF-8">
    </head>
    <body>
        <div class="nota">
            <p>
                <strong>User:</strong> gu4rd4-01 <br>
                <strong>Senha:</strong> 11-06-1969
            </p>
        </div>
        <div class="fordada">
            <img src="imgs/fordada.jpg" alt="fordada" width="400px" height="200px">
        </div>
        
        <div class="led"></div>
        
        <div class="buton" onclick="LigarLED()">
            <p>on/off</p>
        </div>
        
        <div class="monitor" id="monitor">
            
        </div>
        
        <div class="logo">
            <h1>Negativo =( </h1>
        </div>

        <div class="audio1"></div>
        <div class="audio2"></div>
        <div class="audio3"></div>
        <!-- link do video cctv: https://pixabay.com/videos/hallway-dark-corridor-dim-mystery-20837/  -->

        <script>
            let ledLigado = false;
            let loginVisivel = false;

            function LigarLED() {
                const led = document.querySelector('.led');
                const monitor = document.getElementById('monitor');
                
                ledLigado = !ledLigado;
                
                if (ledLigado) {
                    led.classList.add('ligado');
                    monitor.innerHTML = '';
                    loginVisivel = false;
                    
                    const mensagens = [
                        '>_inicializing.',
                        '>_inicializing.._',
                        '>_inicializing..._',
                        '>_1%_',
                        '>_10%_',
                        '>_25%_',
                        '>_50%_',
                        '>_67%_',
                        '>_75%_',
                        '>_inicialization complete!_',
                        '>_Hello Juliet_',
                        '>_Bem Vindo ao terminal_'
                    ];
                    
                    mensagens.forEach((msg, index) => {
                        setTimeout(() => {
                            monitor.innerHTML += '<h1>' + msg + '</h1><br>';
                        }, index * 800); 
                    });
                    
                    setTimeout(() => {
                        loginVisivel = true;
                        monitor.innerHTML = '';

                        const titulo = document.createElement('h2');
                        titulo.textContent = 'LOGIN';
                        monitor.appendChild(titulo);

                        const form = document.createElement('form');
                        form.style.display = 'flex';
                        form.style.flexDirection = 'column';
                        form.style.gap = '10px';
                        form.style.marginTop = '20px';

                        const inputUser = document.createElement('input');
                        inputUser.type = 'text';
                        inputUser.id = 'username';
                        inputUser.placeholder = 'User';
                        inputUser.required = true;
                        inputUser.style.padding = '8px';
                        inputUser.style.backgroundColor = '#222';
                        inputUser.style.color = '#0f0';
                        inputUser.style.border = '1px solid #0f0';

                        const inputPassword = document.createElement('input');
                        inputPassword.type = 'password';
                        inputPassword.id = 'password';
                        inputPassword.placeholder = 'Senha';
                        inputPassword.required = true;
                        inputPassword.style.padding = '8px';
                        inputPassword.style.backgroundColor = '#222';
                        inputPassword.style.color = '#0f0';
                        inputPassword.style.border = '1px solid #0f0';

                        const botao = document.createElement('button');
                        botao.type = 'submit';
                        botao.textContent = 'ENTRAR';
                        botao.style.padding = '8px';
                        botao.style.backgroundColor = '#0f0';
                        botao.style.color = '#000';
                        botao.style.border = 'none';
                        botao.style.cursor = 'pointer';
                        botao.style.fontWeight = 'bold';

                        const erro = document.createElement('p');
                        erro.id = 'erro-login';
                        erro.style.color = 'red';
                        erro.style.margin = '10px 0 0 0';

                        form.appendChild(inputUser);
                        form.appendChild(inputPassword);
                        form.appendChild(botao);
                        form.appendChild(erro);
                        form.addEventListener('submit', fazerLogin);

                        monitor.appendChild(form);
                    }, mensagens.length * 800 + 1000);

                } else {
                    led.classList.remove('ligado');
                    monitor.innerHTML = '';
                    loginVisivel = false;
                }
            }
            
           function fazerLogin(event) {
    event.preventDefault();
    
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const erroLogin = document.getElementById('erro-login');
    
    const usuariosValidos = [
        { user: 'ADMIN', senha: 'ADMIN' },
        { user: 'gu4rd4-01', senha: '11-06-1969' }
    ];
    
    const usuarioValido = usuariosValidos.some(u => u.user === username && u.senha === password);
    
    if (usuarioValido) {
        erroLogin.textContent = '';
        const monitor = document.getElementById('monitor');
        
        // 1. Define a mensagem inicial de sucesso
        monitor.innerHTML = '<h1 id="status-mapa">>_Login bem-sucedido!_</h1>';

        // 2. Cria o container do mapa (essencial para o ponto do laboratório funcionar)
        const mapaContainer = document.createElement('div');
        mapaContainer.className = 'mapa-container';

        // Cria o elemento de imagem para o mapa
        const imgMapa = document.createElement('img');
        imgMapa.src = 'imgs/Mapa-A.png';
        imgMapa.alt = 'Mapa';
        imgMapa.className = 'mapa-monitor';
        mapaContainer.appendChild(imgMapa);

        // 3. Cria o ponto de clique invisível do Laboratório
        const pontoLaboratorio = document.createElement('div');
        pontoLaboratorio.className = 'ponto-laboratorio';
        pontoLaboratorio.title = 'Acessar Câmeras do Laboratório';
        pontoLaboratorio.style.display = 'none'; 
        mapaContainer.appendChild(pontoLaboratorio);

        monitor.appendChild(mapaContainer);

        // 4. Cria o elemento do Pop-up de Vídeo (CCTV) - CAMINHO CORRIGIDO AQUI
        const popupCCTV = document.createElement('div');
        popupCCTV.className = 'popup-cctv';
        popupCCTV.innerHTML = `
            <div class="popup-header">
                <span>>_FEED_CCTV: LAB_01</span>
                <button class="btn-fechar-popup">X</button>
            </div>
            <video src="imgs/CCtv.mp4" autoplay loop muted></video>
        `;
        monitor.appendChild(popupCCTV);

        // 5. Cria o botão para alternar os mapas
        const btnTrocar = document.createElement('button');
        btnTrocar.textContent = 'Alternar Mapa';
        btnTrocar.className = 'btn-trocar-mapa';
        monitor.appendChild(btnTrocar);

        let mapaAtual = 'A';

        // Temporizador para o texto superior
        setTimeout(() => {
            const statusTexto = document.getElementById('status-mapa');
            if (statusTexto) {
                statusTexto.textContent = `>_Mapa-${mapaAtual}`;
            }
        }, 2000);

        // Lógica do clique para alternar os mapas
        btnTrocar.addEventListener('click', () => {
            const statusTexto = document.getElementById('status-mapa');
            
            if (mapaAtual === 'A') {
                imgMapa.src = 'imgs/Mapa-B.png';
                mapaAtual = 'B';
                pontoLaboratorio.style.display = 'block'; // Mostra o ponto clicável no Mapa-B
            } else {
                imgMapa.src = 'imgs/Mapa-A.png';
                mapaAtual = 'A';
                pontoLaboratorio.style.display = 'none';  // Esconde o ponto no Mapa-A
                popupCCTV.classList.remove('visivel');    // Fecha o vídeo se mudar de mapa
            }

            if (statusTexto && statusTexto.textContent !== '>_Login bem-sucedido!_') {
                statusTexto.textContent = `>_Mapa-${mapaAtual}`;
            }
        });

        // Evento para abrir o Pop-up ao clicar na bolinha do Laboratório
        pontoLaboratorio.addEventListener('click', () => {
            popupCCTV.classList.add('visivel');
            const video = popupCCTV.querySelector('video');
            if (video) video.play();
        });

        // Evento para fechar o Pop-up no botão "X"
        popupCCTV.querySelector('.btn-fechar-popup').addEventListener('click', () => {
            popupCCTV.classList.remove('visivel');
            const video = popupCCTV.querySelector('video');
            if (video) video.pause(); // Pausa o vídeo enquanto fechado
        });

    } else {
        erroLogin.textContent = 'User ou senha incorretos!';
    }
}
</script>
    </body>
</html>
