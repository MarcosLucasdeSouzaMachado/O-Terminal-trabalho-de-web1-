<!DOCTYPE html>
<html>
    <head>
        <title>O Terminal</title>
        <link rel="stylesheet" href="style/estilo.css">
        <meta charset="UTF-8">
    </head>
    <body>
        <div class="nota">
            <p>
                <strong>User:</strong> gu4rd4-01 <br>
                <strong>Senha:</strong> 11-06-1969
            </p>
        </div>
        
        <div class="led"></div>
        
        <div class="buton" onclick="LigarLED()">
            <p>on</p>
        </div>
        
        <div class="monitor" id="monitor">
            <h1>
                >_Hello Juliet_<br>
                >_Bem Viado ao terminal_
            </h1>
        </div>
        
        <div class="logo">
            <h1>Negativo =( </h1>
        </div>

        <script>
            let ledLigado = false;

            function LigarLED() {
                const led = document.querySelector('.led');
                const monitor = document.getElementById('monitor');
                
                ledLigado = !ledLigado;
                
                if (ledLigado) {
                    led.classList.add('ligado');
                    monitor.innerHTML = '<h1>>_inicializing..._</h1>';
                } else {
                    led.classList.remove('ligado');
                    monitor.innerHTML = '<h1>>_Hello Juliet_<br>>_Bem Viado ao terminal_</h1>';
                }
            }
        </script>
    </body>
</html>
